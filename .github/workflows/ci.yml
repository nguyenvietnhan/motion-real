name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Remotion and desktop
        run: npm run build

      - name: Reject high dependency advisories
        run: npm audit --audit-level=high

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Install browser used by the embedded UI smoke
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run test:browser

      - name: Restore Remotion Chrome Headless Shell
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules/.remotion
          key: remotion-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Remotion browser
        run: npx --no-install remotion browser ensure

      - name: Real-render smoke
        env:
          MOTIONREAL_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/motionreal-smoke
        run: npm run smoke

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-diagnostics
          path: |
            ${{ runner.temp }}/motionreal-smoke/**
            /home/runner/.npm/_logs/**
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Build desktop
        run: npm run build:desktop

      - name: Launcher port safety smoke
        run: node --test apps/desktop/scripts/launch-utils.test.mjs

      - name: Windows path and process tests
        run: npm test -- apps/desktop/src/main/runtime-security.test.ts apps/desktop/src/main/agent/harness-manager.test.ts
