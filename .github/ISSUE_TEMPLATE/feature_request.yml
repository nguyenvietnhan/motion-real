name: Feature request
description: Suggest an improvement or new capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        MotionReal is **short-form 9:16 only** and **pure AUTHOR** (fresh scene TSX per video).
        Requests that reintroduce template catalogs or landscape YouTube formats are likely out of scope — see `AI_CONTRACT.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should this explicitly not include?
    validations:
      required: false
